name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    # unlike the default, it enables pipefail
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.13

      - name: Lint
        run: mise run lint

  build:
    uses: docker/github-builder/.github/workflows/bake.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read
      id-token: write # to sign the cache
    with:
      target: bin
      vars: PLATFORMS=linux/amd64,linux/arm64
      output: local
      artifact-name: bin
      artifact-upload: true
      artifact-retention-days: 1
      sign: 'false' # only used by the tests below
      cache: true
      cache-mode: max

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    outputs:
      variants: ${{ steps.variants.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.13

      - name: Download binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin
          path: bin

      - name: Build variants
        run: |
          bin="bin/linux_$(dpkg --print-architecture)"
          chmod +x "$bin/systemd"
          mise run build images --set "*.contexts.bin=$bin"

      - name: Test variants
        run: mise run test --verbose

      - name: List variants
        id: variants
        run: |
          variants="$(docker buildx bake --print images | jq -c '[
            .target | to_entries[] | {
              target: .key,
              image: (.value.tags[0] | sub(":.*"; "")),
              distribute: (.value.dockerfile != "Dockerfile"),
              tags: (.value.tags | map("type=raw,value=" + sub(".*:"; "")) | join("\n"))
            }
          ]')"
          echo "variants=$variants" >> "$GITHUB_OUTPUT"

  publish-bin:
    needs: [lint, test]
    if: github.event_name == 'push'
    uses: docker/github-builder/.github/workflows/bake.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read
      id-token: write # to sign the attestations and cache
      packages: write
    with:
      target: bin
      vars: PLATFORMS=linux/amd64,linux/arm64
      output: image
      push: true
      cache: true
      cache-mode: max
      meta-images: ghcr.io/felipecrs/systemd
      meta-tags: type=raw,value=bin
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  publish-variants:
    needs: [test, publish-bin]
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.test.outputs.variants) }}
    name: publish-${{ matrix.variant.target }}
    uses: docker/github-builder/.github/workflows/bake.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read
      id-token: write # to sign the attestations
      packages: write
    with:
      target: ${{ matrix.variant.target }}
      vars: PLATFORMS=linux/amd64,linux/arm64
      # use the binary published above instead of building it again
      set: '*.contexts.bin=docker-image://ghcr.io/felipecrs/systemd@${{ needs.publish-bin.outputs.digest }}'
      # nothing is executed in the base one, so emulation is not needed
      distribute: ${{ matrix.variant.distribute }}
      output: image
      push: true
      sbom: true
      meta-images: ${{ matrix.variant.image }}
      meta-tags: ${{ matrix.variant.tags }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
