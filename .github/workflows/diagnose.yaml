name: diagnose

on: pull_request

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          docker run -d -t --name old --tmpfs /run --security-opt writable-cgroups=true --cap-add NET_ADMIN --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt seccomp=unconfined --security-opt systempaths=unconfined ghcr.io/felipecrs/systemd-dind
          for i in $(seq 30); do docker exec old docker info >/dev/null 2>&1 && break; sleep 1; done
          echo "#### old: privileged"
          docker exec old docker run --rm --privileged alpine sh -c 'mount -t tmpfs tmpfs /mnt && echo mount-ok' 2>&1 | tail -2
          echo "#### old: buildx container driver"
          docker exec old docker buildx create --name b --use --bootstrap 2>&1 | tail -3
          printf 'FROM alpine\nRUN echo built-ok\n' | docker exec -i old docker buildx build --progress=plain - 2>&1 | grep -E 'built-ok|ERROR' | tail -3
          echo "#### old: dind in dind"
          docker exec old docker run -d --privileged --name inner docker:dind --tls=false 2>&1 | tail -1
          sleep 12; docker exec old docker exec inner docker run --rm alpine echo nested-ok 2>&1 | tail -1
