name: diagnose

on: pull_request

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45628656459 -n bin -D bin
          gh run download 45628656459 -n passt -D passt-bin
          chmod +x bin/*/systemd passt-bin/*/passt
          docker buildx bake dind-29-10-1-trixie --set "*.contexts.bin=bin/linux_amd64" --set "*.contexts.passt=passt-bin/linux_amd64"
      - run: |
          set +e
          uname -r
          base="--security-opt seccomp=unconfined --security-opt apparmor=rootlesskit --security-opt systempaths=unconfined --device /dev/net/tun"
          try() { # name, then command prefix for the nested docker
            n=$1; shift
            for _ in $(seq 60); do "$@" info >/dev/null 2>&1 && break; sleep 1; done
            echo "######## $n"
            "$@" info 2>&1 | grep -E 'Storage|Cgroup|Runtime|rootless|ERROR|annot'
            "$@" run --rm alpine echo plain-ok 2>&1 | tail -3
            "$@" run --rm --memory=64m alpine cat /sys/fs/cgroup/memory.max 2>&1 | tail -3
            "$@" run --rm --privileged alpine sh -c 'mount -t tmpfs tmpfs /mnt && echo mount-ok; grep " /sys" /proc/self/mountinfo' 2>&1 | tail -6
            "$@" run --rm --privileged alpine sh -c 'echo w > /proc/sys/kernel/hostname && echo procsys-ok; mount -o remount,rw /sys && echo remount-ok' 2>&1 | tail -3
            echo "## dind-in-dind"
            "$@" run -d --privileged --name inner docker:29-dind --tls=false >/dev/null 2>&1
            for _ in $(seq 25); do "$@" exec inner docker info >/dev/null 2>&1 && break; sleep 1; done
            "$@" exec inner docker run --rm alpine echo nested-ok 2>&1 | tail -3
            "$@" logs inner 2>&1 | grep -iE 'failed|error' | tail -3
            "$@" rm -fv inner >/dev/null 2>&1
            echo "## buildx container driver"
            "$@" buildx create --name b --driver docker-container >/dev/null 2>&1
            printf 'FROM alpine\nRUN echo built-ok\n' | "$@" buildx build --builder b --progress plain - 2>&1 | grep -E 'built-ok|ERROR|rror' | tail -4
            "$@" buildx rm b >/dev/null 2>&1
          }
          start() { n=$1; shift; docker run -d -t --name "$n" --tmpfs /run --security-opt writable-cgroups=true $base "$@" ghcr.io/felipecrs/systemd-dind:trixie >/dev/null; }

          start norec --mount type=bind,source=/sys,target=/mnt/sys,bind-recursive=disabled; try norec docker exec -i norec docker
          docker exec norec sh -c 'grep " /mnt/sys" /proc/self/mountinfo; ls /mnt/sys/fs/cgroup | head -3'
          echo "## kind"
          docker exec norec sh -c 'apt-get update -qq; apt-get install -y -qq --no-install-recommends curl >/dev/null 2>&1; curl -fsSLo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64; chmod +x /usr/local/bin/kind; kind version; kind create cluster --wait 120s 2>&1 | tail -25; docker ps'
          docker rm -fv norec

          start norecro --mount type=bind,source=/sys,target=/mnt/sys,bind-recursive=disabled,readonly; try norecro docker exec -i norecro docker; docker rm -fv norecro

          start crun
          docker exec crun sh -c 'apt-get update -qq; apt-get install -y -qq --no-install-recommends crun >/dev/null 2>&1; mkdir -p /etc/docker; echo "{\"default-runtime\":\"crun\",\"runtimes\":{\"crun\":{\"path\":\"/usr/bin/crun\"}}}" >/etc/docker/daemon.json; pkill -x dockerd; sleep 6'
          try crun docker exec -i crun docker; docker rm -fv crun

          echo "######## host exposure (opens without writing)"
          probe='for f in /proc/sys/kernel/core_pattern /sys/kernel/uevent_helper /mnt/sys/kernel/uevent_helper; do [ -e $f ] && { (: >>$f) 2>/dev/null && echo "$f writable" || echo "$f denied"; }; done'
          echo "# published options"; docker run --rm --entrypoint sh --cap-add SYS_ADMIN --cap-add NET_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined ghcr.io/felipecrs/systemd-dind:trixie -c "$probe; mount -o remount,rw /sys && $probe"
          echo "# new options"; docker run --rm --entrypoint sh $base ghcr.io/felipecrs/systemd-dind:trixie -c "$probe"
          echo "# new options with sys"; docker run --rm --entrypoint sh $base --mount type=bind,source=/sys,target=/mnt/sys,bind-recursive=disabled ghcr.io/felipecrs/systemd-dind:trixie -c "$probe"
      - if: always()
        run: sudo dmesg | grep -iE 'apparmor.*DENIED' | tail -8
