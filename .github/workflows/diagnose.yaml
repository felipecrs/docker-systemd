name: diagnose

on: pull_request

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone kernel.apparmor_restrict_unprivileged_unconfined || true
          docker version --format '{{.Server.Version}}'; docker info -f '{{.SecurityOptions}}'
          sudo grep -lE '^\s*userns,' /etc/apparmor.d/* | xargs -n1 basename | tr '\n' ' '; echo
          try() {
            echo "#### $*"
            docker run --rm --security-opt seccomp=unconfined --security-opt systempaths=unconfined "$@" ubuntu:26.04 \
              sh -c 'unshare --user --map-root-user --mount --net sh -c "cat /proc/self/attr/current; mount -t tmpfs t /mnt && echo mount-ok; echo 1 >/proc/sys/net/ipv4/ip_forward && echo sysctl-ok"' 2>&1 || true
          }
          try --security-opt apparmor=unconfined
          try --security-opt apparmor=unconfined --cap-add SYS_ADMIN
          for p in runc crun podman buildah rootlesskit lxc-unshare unprivileged_userns; do try --security-opt "apparmor=$p"; done
          sudo dmesg | grep -i apparmor | grep -iE 'userns|DENIED' | tail -8
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          try --security-opt apparmor=unconfined
